[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bibagent"
version = "0.1.0"
description = "Evidence-first, auditable bibliometric research agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "adjustText>=1.3",
  "duckdb>=1.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "markdown>=3.7",
  "matplotlib>=3.9",
  "networkx>=3.4",
  "numpy>=1.26,<2",
  "pandas>=2.2",
  "pillow>=10.4",
  "python-docx>=1.1",
  "pyarrow>=17,<26",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.11,<1.14",
  "seaborn>=0.13",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.7"]

[project.scripts]
bibagent = "bibagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bibagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
