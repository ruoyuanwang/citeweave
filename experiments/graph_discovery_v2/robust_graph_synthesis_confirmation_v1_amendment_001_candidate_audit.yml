change:
  reason: >-
    Add a deterministic candidate auditor and blinded 100-record relevance packets
    after observing only acquisition completeness and registered graph-size gates.
    The first packet serialization emitted non-standard NaN abstract values; before
    any reviewer access, those missing values were normalized to JSON null.
  changes_candidate_topics: false
  changes_priority_or_selection_rule: false
  changes_data_gates: false
  changes_query_relevance_threshold: false
  changes_perturbations_or_tasks: false
  changes_model_conditions_or_statistics: false
  changes_observed_provider_outcomes: false
  reserve_rule: >-
    Because priorities 1 through 8 all passed automatic gates, priorities 9 through
    12 remain unacquired unless a blinded relevance judgment excludes a higher-priority
    candidate. Their absence is not an automatic-gate failure.
  packet_rule: >-
    Select exactly 100 records by SHA256(protocol, dataset, work_id), disclose only
    an anonymous candidate code, registered concepts, title, abstract and year, and
    never disclose candidate priority, graph statistics, perturbations or task gold.
