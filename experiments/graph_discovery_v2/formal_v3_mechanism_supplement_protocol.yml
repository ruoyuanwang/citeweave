registered_hypotheses:
  M1_same_computation_representation:
    estimand: graph_program_minus_flat_program_answer_accuracy
    population: all_168_tasks
    test: two_one_sided_exact_dataset_sign_flip
    equivalence_margin: 0.05_absolute_accuracy
    interpretation: >-
      Equivalence means the system gain comes from graph computation, not JSON graph
      layout. Non-equivalence requires reporting direction and investigating context
      truncation, provenance visibility, or formatting.
  M2_raw_provenance_value:
    estimands:
      - graph_program_minus_operator_only_evidence_f1
      - graph_program_minus_operator_only_answer_accuracy
    population: 120_complex_tasks
    joint_gate:
      evidence_f1: one_sided_exact_dataset_sign_flip_greater_than_zero
      answer_accuracy: one_sided_exact_dataset_sign_flip_noninferiority_margin_0.05
    interpretation: >-
      Success supports raw graph/provenance value beyond an answer-bearing operator
      trace; answer accuracy alone is insufficient.
  M3_incomplete_trace_selectivity:
    estimand: >-
      (graph_program - operator_only) on bridge-counterfactual tasks minus the same
      contrast on fully trace-derivable task types
    outcome: answer_accuracy
    fully_trace_derivable_task_types:
      - multi_hop_connector
      - community_role_contrast
      - hub_removal_resilience
      - temporal_structural_shift
    test: one_sided_exact_dataset_sign_flip
    role: secondary_mechanism_check
statistics:
  independent_unit: dataset_id
  minimum_datasets: 8
  within_dataset: paired_task_effect_then_equal_weight
  across_dataset: equal_weight_mean
  exact_tests: fully_enumerated_2_to_the_8_sign_flips
  descriptive_interval: 10000_draw_equal_dataset_bootstrap_seed_20260831
  multiplicity: Holm_for_M2_evidence_superiority_and_M3_selectivity
  mixed_models: diagnostic_only
interpretation_guards:
  - >-
    Graph-program versus retrieval-only contrasts estimate deterministic graph
    computation plus grounded synthesis, not unaided LLM graph reasoning.
  - >-
    Graph-shaped serialization is not an innovation claim if flat-program is
    equivalent under identical computed content.
  - >-
    Operator-only answer accuracy cannot establish provenance sufficiency; evidence
    fidelity and raw-record traceability are required.
  - >-
    This supplement is separate from C1/C2 and cannot replace or rescue a failed
    registered complexity-by-scale result.
execution_guard:
  - No provider call before the corrected neural qualification and explicit promotion.
  - No supplement execution before primary, replication, and extension source cells are terminal and hash-audited.
  - No change to existing 800, 120, or 312-call confirmatory plans.
  - Incremental supplement calls terminate after the first valid provider response; no quality-based resampling.
