interpretation_guard: >-
  Matched tasks increase within-topic precision but never increase the number of
  inferential replicates. Rejecting an item-level McNemar test without passing the
  corresponding Holm-adjusted E1/E2 topic-cluster test is insufficient for a
  cross-topic superiority claim.
