reason: >-
  A result-blind inference audit found that the original primary-panel H1/H2 exact
  McNemar tests operate at the matched-task level even though dataset_id is the
  registered cluster unit. Tasks from one scientific topic may be correlated, so
  item-level significance alone can be anti-conservative. The already frozen
  eight-dataset complexity-extension panel contains the necessary conditions and
  permits exact topic-cluster validation without any new model calls.
cluster_validity_family:
  cluster_unit: dataset_id
  clusters: 8
  within_dataset_weighting: equal mean over all registered included tasks
  across_dataset_weighting: equal
  tests:
    E1:
      contrast: graph_program_minus_flat_hybrid
      subset: complexity_3_to_5_inclusive_in_extension_panel
      direction: greater_than_zero
      inference: one_sided_exact_dataset_cluster_sign_flip
    E2:
      contrast: graph_hierarchical_retrieval_v2_minus_flat_hybrid
      subset_task_types:
        - bridge_counterfactual
        - community_role_contrast
        - hub_removal_resilience
        - temporal_structural_shift
      direction: greater_than_zero
      inference: one_sided_exact_dataset_cluster_sign_flip
  multiplicity: Holm step-down over E1 and E2 at alpha 0.05
  minimum_attainable_one_sided_p: 0.00390625
  descriptive_interval: 10000-draw equal-dataset cluster bootstrap
relationship_to_existing_tests:
  - Original registered item-level McNemar results remain reported and are not erased.
  - E1/E2 are the required cluster-validity checks for paper-level claims that graph
    program or hierarchical GraphRAG outperforms flat hybrid on complex tasks.
  - C1/C2 remain the separate registered complexity-selectivity and scale-amplification
    family and retain their own Holm adjustment.
  - E1/E2 do not establish C1 or C2 and cannot substitute for them.
unchanged:
  - tasks, labels, conditions, prompts, contexts, model, tokenizer, token budgets
  - all API calls and the 672-cell reuse plan
  - C1-C4 estimands, GLMM, TOST, bootstrap counts, and seeds
  - original H1-H3 and R1 outputs
