schema_version: 1
protocol_id: robust_graph_synthesis_continuous_difficulty_development_v1
status: frozen_after_deterministic_task_construction_before_any_model_outcomes
frozen_at: '2026-09-08T07:30:00+08:00'
role: development_difficulty_calibration_not_confirmatory_evidence
motivation: >-
  The completed complexity extension separated simple lookup from graph computation,
  but several conditions reached floor or ceiling performance and scale amplification
  was zero. This development panel asks whether perturbation ensembles, conflicting
  structural signals, counterfactual decomposition and cross-operator synthesis create
  an informative difficulty spectrum while retaining exact deterministic gold.
source_status:
  prior_model_outcomes_known: true
  perturbation_outcomes_known_during_task_design: true
  implication: >-
    Results from these eight reused topics may calibrate tasks and mechanisms but may
    not be presented as a new confirmatory test. A confirmatory panel requires new
    held-out topics frozen before perturbation outcomes and provider responses.
source_bindings:
  robustness_input_freeze:
    path: experiments/graph_discovery_v2/graph_phenomenon_robustness_v1/input_freeze.json
    sha256: 5dd90223db8af3a09649595144efe2076ead462bc13698b63aa12c1e9b938665
  robustness_summary:
