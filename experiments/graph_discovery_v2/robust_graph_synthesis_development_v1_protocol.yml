panel:
  independent_topics: 8
  registered_perturbations_per_topic: 17
  baseline_graphs_per_topic: 1
  task_types:
    - path_stability_profile
    - community_role_instability
    - hub_resilience_decomposition
    - temporal_window_dependence
    - cross_operator_robustness_triage
  tasks_per_topic: 5
  total_tasks: 40
  conditions:
    - flat_bm25
    - graph_hierarchical_retrieval_v2
    - flat_program
    - graph_program
    - operator_only
  planned_provider_calls: 200
  context_record_budget: 20
  context_token_budget: 8192
  one_valid_response_per_cell: true
  temperature: 0
  model_prompt_tokenizer_budget: identical_across_conditions_except_registered_context
task_requirements:
  - aggregate evidence across multiple perturbations rather than explain one graph
  - identify instability and non-comparable cases rather than force a single narrative
  - decompose pre-existing topology loss from marginal node-deletion loss
  - distinguish label changes from community-relation changes across temporal windows
  - compare five non-interchangeable graph operators without averaging away conflict
outcomes:
  primary: answer_field_accuracy
  secondary:
    - exact_answer_accuracy
    - evidence_f1
    - required_limitation_rate
    - abstention_rate
    - provider_tokens
    - elapsed_seconds
  rationale: >-
    Field accuracy supplies a continuous outcome when an answer contains several
    registered components; exact accuracy is retained as a strict secondary outcome.
registered_development_questions:
  D1_computation_value:
    contrast: graph_program_minus_flat_bm25_answer_field_accuracy
    expectation: positive
  D2_graph_retrieval_value:
    contrast: graph_hierarchical_retrieval_v2_minus_flat_bm25_answer_field_accuracy
    expectation: positive
  D3_representation_only:
    contrast: graph_program_minus_flat_program_answer_field_accuracy
    expectation: equivalence
    equivalence_margin: 0.05
  D4_raw_provenance_value:
    joint_contrast:
      - graph_program_minus_operator_only_evidence_f1_greater_than_zero
      - graph_program_minus_operator_only_answer_field_accuracy_noninferior_margin_0.05
statistics:
  independent_unit: dataset_id
  within_topic: paired_task_then_equal_task_type_weight
  across_topics: equal_topic_weight
  exact_test: fully_enumerated_2_to_the_8_cluster_sign_flips
  descriptive_interval: 10000_draw_topic_cluster_bootstrap_seed_20260908
  multiplicity: Holm_for_D1_D2_and_D4_evidence_superiority
  no_item_level_pseudoreplication: true
promotion_gate:
  development_success_requires:
    - all_200_cells_terminal_without_quality_resampling
    - at_least_three_distinct_condition_means_on_field_accuracy
    - neither_all_condition_floor_nor_all_condition_ceiling
    - D3_equivalence_or_documented_information_parity_failure
  confirmatory_success_requires_new_data: true
  heldout_confirmation:
    minimum_topics: 8
    freeze_before:
      - perturbation_generation
      - deterministic_gold_inspection
      - provider_responses
    same_task_builder_and_scoring: true
interpretation_guards:
  - Development results cannot rescue or replace the completed C1/C2 analyses.
  - A graph-program advantage estimates registered computation plus evidence organization, not unaided LLM graph reasoning.
  - D3 equivalence means graph-shaped serialization has no independent value when information is matched.
  - Robustness labels are conditional on the registered perturbation grid and corpus.
  - Algorithmic community instability is not evidence that scientific themes are false.
  - No development outcome may be called confirmatory or independent replication.
