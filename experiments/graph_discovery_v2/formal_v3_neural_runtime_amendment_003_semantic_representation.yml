  pipeline_sha256: 9227da3db7f027b6be34a77d0585e96aab0647c2dca95b5ff4b2e026d0a9de49
representation:
  id: semantic_entity_relation_json_v2
  node_fields: [network, record_type, label]
  edge_fields: [network, record_type, source_label, target_label]
  excluded_from_embedding:
    - evidence_id
    - node_id
    - importance
    - community
    - weighted_degree
    - edge_weight
  rationale:
    - Ordinal evidence IDs have no linguistic meaning and may refer to different
      relations across graph scales.
    - Importance, community, degree, and edge weight are scale-dependent graph
      features. Excluding them prevents structural information from leaking into the
      flat neural baseline; they remain intact in evidence rows for graph retrieval,
      reranking, reasoning, and generation.
    - Display labels are the human-readable semantic content available equally to the
      flat neural baseline and graph conditions.
semantic_duplicate_rule:
  behavior: encode_or_reuse_one_identical_vector_but_preserve_distinct_graph_rows
  rationale: Different graph identities can have the same visible label. They share
    neural text and therefore a vector, but their node IDs, evidence IDs, graph edges,
    weights, and communities are never merged.
cross_scale_reuse:
  source_scale: large
  match_key: sha256_of_semantic_entity_relation_json_v2
  approximate_matching: prohibited
  unmatched_rows: encoded_normally
  audit: experiments/graph_discovery_v2/formal_v3_execution_prerequisites/exact_scale_embedding_reuse_semantic_v2_audit.json
