selection:
  target_topics: 8
  reserve_topics: 4
  rule: first_eight_eligible_candidates_by_frozen_priority
  insufficient_topics: stop_without_substitution
  eligibility_assessed_before:
    - registered_perturbation_generation
    - deterministic_gold_inspection
    - benchmark_context_construction
    - provider_model_calls
  data_gates:
    exhaustive_openalex_cursor_pagination: true
    complete_natural_years_through: 2025
    minimum_canonical_works: 200
    minimum_nonempty_publication_years: 6
    minimum_large_keyword_nodes: 100
    minimum_large_keyword_edges: 500
    no_placeholder_author_identity: true
  query_relevance_gate:
    sample: 100_hash_selected_title_abstract_records_per_candidate
    reviewers: 2_independent_domain_qualified_reviewers_or_frozen_independent_judges
    blind_to: [candidate_priority, graph_statistics, perturbations, task_gold, model_outcomes]
    item_label: relevant_only_if_both_concepts_are_scientifically_central
    resolution: independent_third_reviewer_for_disagreement
    minimum_resolved_relevance_rate: 0.80
    exclusion_only_by_registered_gate: true

acquisition:
  source: openalex
  document_types: [article]
  query_mode: all
  full_census: true
  partition_strategy: adaptive_date
  target_slice_records: 25000
  candidate_pool_size: 2000
  edge_row_limit: 1000000

perturbation_design:
  baseline_graphs_per_topic: 1
  registered_perturbations_per_topic: 17
  one_factor_at_a_time: true
  families:
    - minimum_edge_weight
    - deterministic_edge_dropout
    - community_seed
    - community_resolution
    - temporal_window
  no_parameter_tuning_after_selection: true

benchmark:
  task_builder: robust_graph_synthesis_development_v1_unchanged
  task_types:
    - path_stability_profile
    - community_role_instability
    - hub_resilience_decomposition
    - temporal_window_dependence
    - cross_operator_robustness_triage
  tasks_per_topic: 5
  total_tasks: 40
  answer_fields_per_task: 5_to_7
  record_budget: 20
  context_token_budget: 8192
  conditions:
    - flat_bm25
    - graph_hierarchical_retrieval_v2
    - flat_program
    - graph_program
    - operator_only
  planned_provider_calls: 200
  information_parity:
    graph_program_vs_flat_program: identical_raw_evidence_and_operator_trace
    hierarchy_and_bm25: operator_trace_hidden
    operator_only: raw_provenance_hidden

outcomes:
  primary: answer_field_accuracy
  secondary:
    - exact_answer_accuracy
    - evidence_f1
    - required_limitation_rate
    - abstention_rate
    - provider_tokens
    - elapsed_seconds

hypotheses:
  - id: C1
    contrast: graph_program_minus_flat_bm25_answer_field_accuracy
    direction: positive
    primary: true
  - id: C2
    contrast: graph_hierarchical_retrieval_v2_minus_flat_bm25_answer_field_accuracy
    direction: positive
    primary: true
  - id: C3
    contrast: graph_program_minus_flat_program_answer_field_accuracy
    direction: equivalence
    equivalence_margin: 0.05
    primary: true
  - id: C4
    contrast: graph_program_minus_operator_only
    joint_gate:
      evidence_f1: superior
      answer_field_accuracy: noninferior
      noninferiority_margin: -0.05
    primary: true

statistics:
  independent_unit: dataset_id
  within_topic: paired_task_then_equal_task_type_weight
  across_topics: equal_topic_weight
  exact_test: fully_enumerated_2_to_the_8_cluster_sign_flips
  descriptive_interval: 10000_draw_topic_cluster_bootstrap_seed_20260908
  multiplicity: Holm_for_C1_C2_and_C4_evidence_superiority
  exact_accuracy_is_secondary: true
  no_item_level_pseudoreplication: true

execution_freeze_gate:
  required_before_provider_calls:
    - selected_eight_topic_ids_and_exclusion_reasons
    - acquisition_and_canonical_table_hashes
    - all_144_perturbation_case_hashes
    - all_40_task_gold_answers
    - all_200_request_message_hashes
    - exact_tokenizer_audit
    - implementation_hash_revalidation
  any_hash_drift: stop_and_version_amendment_before_outcomes

interpretation_guards:
  - Graph Program estimates registered deterministic computation plus evidence organization.
  - C3 isolates organization only; equivalence rejects graph-shaped serialization as the mechanism.
  - C4 isolates raw provenance conditional on identical operator content.
  - Robustness claims are conditional on the frozen perturbation grid and OpenAlex corpus.
  - No structural association may be described as causality, quality or author intent.
  - Candidate exclusion may use only the frozen data and query-relevance gates.

