scope:
  purpose: >-
    Operationalize the registered blind query-relevance gate without changing its
    sample, label rule, threshold, priority rule, tasks, conditions, or analysis.
  primary_review: >-
    Every sampled item receives two complete, independent decisions by
    conflict-free domain-qualified real humans. Review packets hide dataset
    identity, priority, graph statistics, perturbations, gold answers, model
    outcomes, other reviewer identities, and other reviewer answers.
  adjudication: >-
    Primary agreements are final. Only disagreements or cannot-assess primary
    pairs are routed to the third reviewer frozen before collection; that reviewer
    cannot have served as a primary reviewer and sees neither primary answer nor
    primary identity.
  collection_integrity:
    - Reviewer access uses hashed tokens.
    - Task identities and visible content are bound by SHA256.
    - The server owns task fields, ISO timestamps, and visible-review timing.
    - Submissions are immutable and complete return sets are mandatory.
    - Missing, duplicated, foreign, changed, or self-adjudicated work fails closed.
  selection: >-
    After all disagreements are resolved, candidate rates use the registered 0.80
    threshold and topics are selected by the frozen first-eight-eligible priority
    rule. If fewer than eight reviewed candidates pass, selection remains empty
    while registered reserve candidates are processed.
unchanged:
  - candidate sample and hash selection
  - relevance definition and 0.80 eligibility threshold
  - first-eight-eligible frozen priority rule
  - graph perturbations, complex tasks, conditions, outcomes, and statistics
  - prohibition on inspecting downstream outcomes before selection
