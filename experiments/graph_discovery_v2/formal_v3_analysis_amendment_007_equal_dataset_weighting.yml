  test_analyze_formal_v3_scale_replication.py: e747e789563cebb8b3b02fd8178e3445d9b4b4148b4651c96f1d67a9cdf3c256
interpretation_guard: >-
  Every dataset contributes one equally weighted effect. Matched anchors improve
  within-dataset precision but are not independent inferential replicates.
