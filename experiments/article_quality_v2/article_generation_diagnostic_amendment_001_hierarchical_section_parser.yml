reason:
  - The frozen generation gate's section extractor stops at every subsequent Markdown
    heading. A nested level-three finding heading therefore terminates its containing
    level-two Results or Discussion section.
  - All generated drafts use nested finding headings, so the extractor can report empty
    or incomplete top-level sections even when the relevant text is present.
  - Word-count excess and any evidence-token defects are independent of this parser
    defect and remain substantive failures when reproduced by the diagnostic.

