integrity_guard:
  - This amendment was frozen while the registered intake still had zero submitted articles and the evaluator roster had zero real evaluators.
  - Density metrics must never be shown to a blinded evaluator before ratings are locked.
  - Published-article comparisons remain ecological descriptions and cannot substitute for the same-evidence human condition.
