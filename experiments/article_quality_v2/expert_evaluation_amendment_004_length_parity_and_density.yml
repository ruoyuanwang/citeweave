schema_version: 1
amendment_id: expert_evaluation_amendment_004_length_parity_and_density
base_protocol_sha256: 7e8267bd91b69ac12b563aa1e5af47921cd67d521a4f17a28bb652fb1fd875a5
complements_analysis_amendment_sha256: 3a8e707ae9f45705cbe3cfb08287ad41d31c8804bdd2f5efd76fdc1d7ff75100
supersedes_packet_validator_hash_from_amendment_sha256: eb144b0d6f5cac41f5ee009d5e8af6a87474f97ff03836b5aadb6483a1e1212e
status: frozen_before_any_same_evidence_article_or_expert_outcome

reason:
  - Prior work shows that longer machine answers can be preferred because they expose more breadth, so a shared broad word range alone does not rule out a systematic length advantage.
  - Raw correct-claim counts, citation counts, and subjective preference can reward verbosity even when scientific information density does not improve.
  - The registered confirmatory tests remain unchanged; these controls prevent an avoidable treatment-exposure imbalance and add descriptive robustness diagnostics.

pre_review_length_gate:
  tokenizer: Unicode word regex used by the frozen packet validator.
  individual_rule: Every article remains inside the shared topic writing brief.
  within_topic_rule: For every topic, longest article word count divided by shortest article word count must be at most 1.10.
  across_topic_rule: Across the eight topics, the largest condition-mean word count divided by the smallest condition-mean word count must be at most 1.05.
  enforcement_timing: Before blinding, evaluator assignment, or release of any packet.
  failure_rule: Edit or regenerate the article under its original condition and re-freeze all affected hashes; do not truncate after ratings.

pre_review_density_diagnostics:
  level: article
  metrics:
    - evidence token mentions per 1000 words
    - unique evidence tokens per 1000 words
    - candidate claims per 1000 words
    - exact-normalized duplicate candidate claim rate
  role: Descriptive diagnostics only; hidden from evaluators and excluded from A1/A2/A3 testing.

post_review_density_diagnostics:
  claim_resolution: Same two-primary-rater and third-person-adjudication rule as analysis amendment 003.
  metrics:
    - adjudicated correct-and-supported sampled claims per 1000 words
    - adjudicated overclaims per 1000 words
    - cannot-assess sampled claims per 1000 words
  aggregation: Compute per article, then average eight equally weighted topic articles within each condition.
  role: Descriptive sensitivity analysis only; no new p-values or superiority decisions.

unchanged_confirmatory_inference:
  primary_cluster_unit: topic
  primary_tests: [A1, A2, A3]
  multiplicity: Holm across A1, A2, and A3
  rule: Word-normalized diagnostics cannot replace, overturn, or rescue the frozen exact topic-cluster tests.

