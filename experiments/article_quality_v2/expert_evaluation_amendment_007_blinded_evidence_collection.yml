integrity_guard:
  - This amendment repairs evidence visibility and data collection; it does not change hypotheses, outcomes, margins, topic count, evaluator eligibility, or statistical analysis.
  - The existing packet manifest remains private because it contains condition mappings; the public collection manifest contains no condition mapping.
  - Raw expert returns remain primary observations and may not be rewritten after submission.
