schema_version: 1
amendment_id: expert_evaluation_amendment_007_blinded_evidence_collection
base_protocol_sha256: 7e8267bd91b69ac12b563aa1e5af47921cd67d521a4f17a28bb652fb1fd875a5
previous_amendment_sha256: 91e9eb03384df3b6450a4c3884b443ac157c715184103cb6cfb792b028b1a362
status: frozen_before_any_same_evidence_article_or_expert_outcome

reason:
  - The prior packet builder blinded PH and REF identifiers in article text but did not materialize a condition-blind evidence viewer that resolved each opaque EV token to the visible graph computation or source excerpt.
  - The prior generic review service supported article-claim auditing but did not collect the registered eight-dimensional holistic ratings or forced pairwise preferences.
  - Without these two execution layers, experts could not validly assess claim support or produce a complete RQ3 panel even after recruitment.
  - No same-evidence human article, registered evaluator, or expert outcome existed when this amendment was frozen.

evidence_viewer_contract:
  identity: Every article-side PH or REF token is replaced by the same deterministic topic-specific EV token used by the blinded article packet.
  graph_content:
    - registered task type and question
    - verified structured answer
    - operator trace and graph evidence identities
    - allowed interpretation, forbidden inferences, and required limitation
  source_content:
    - title
    - year
    - DOI when available
    - frozen abstract excerpt
  hidden_fields:
    - raw PH and REF identifiers
    - article condition and author identity
    - automatic scores
    - source retrieval ranks and selection diagnostics
  parity: All three conditions within a topic use one byte-hashed evidence viewer and one byte-identical figure.
  fail_closed: A sampled claim without at least one resolvable blinded evidence token cannot enter the expert collection.

collection_contract:
  task_types:
    holistic:
      fields:
        - factual_accuracy
        - evidence_traceability
        - phenomenon_depth
        - alternative_explanations
        - epistemic_calibration
        - domain_specificity
        - argumentative_coherence
        - research_utility
      scale: integer_1_to_5
    claim:
      fields: [supported, correct, overclaim, evidence_sufficient, cannot_assess]
      decisive_evidence: Must be a visible EV token attached to the sampled claim unless cannot_assess is true.
    pairwise:
      outcome: forced_preference_between_two_visible_article_codes
  timing: Server-visible heartbeat time; client self-report is excluded.
  immutability: A submitted task cannot be edited or submitted twice.
  identity_guard: Task, evaluator, article, claim, topic, and timing fields are server-owned.
  delivery_guard: Public API responses contain opaque topic/article/evidence codes and never expose registered condition labels.
  primary_return_validation:
    - Every registered task must appear exactly once with an unchanged task-definition hash and server-owned identity fields.
    - Private condition labels are restored only after collection from the frozen packet manifest.
    - Claim disagreements are materialized as a blind-adjudication worklist excluding both primary evaluators.
    - A deterministic workload-balanced router assigns each dispute to one eligible third evaluator who did not make either primary judgment.
    - The adjudicator sees the article, claim, figure, and shared evidence viewer but never sees primary evaluator identities or answers.
    - Only one complete, server-timed adjudication per frozen dispute can be merged into the analysis input.

unchanged_confirmatory_inference:
  article_conditions: [citeweave_graph_review, one_shot_llm, human_same_evidence]
  primary_tests: [A1, A2, A3]
  cluster_unit: topic
  multiplicity: holm_for_A1_A2_A3
  minimum_raters_per_article: 3
  claim_overlap: two_independent_primary_ratings_then_blind_third_person_adjudication
  role_separation: unchanged_from_amendment_005
  length_and_density_controls: unchanged_from_amendment_004
  design_sensitivity_and_claim_scope: unchanged_from_amendment_006

