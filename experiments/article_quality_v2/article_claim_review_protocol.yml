schema_version: 1
protocol_id: article_claim_review_v1
status: frozen_before_machine_drafts_and_human_outcomes
purpose: Convert real expert review into auditable claim corrections and dependency-scoped article revisions, rather than prompt memory.

population:
  topics: 8
  source_condition: citeweave_graph_review
  claims_per_topic: 20
  planned_claim_packets: 160
  planned_primary_reviews: 320
  sampling_frame: Evidence-bearing sentences in Results and Discussion only.
  coverage_constraint: At least two distinct selected claims for each of five registered graph phenomena per topic.
  risk_priority:
    - causal language
    - numerical language
    - multiple-phenomenon synthesis
    - discussion interpretation

review_design:
  primary_reviewers_per_claim: 2
  adjudicators_per_disagreement: 1
  minimum_reviewers_per_topic: 3
  eligibility: Domain-qualified and conflict-free for the assigned topic.
  synthetic_or_llm_proxy_reviewers: prohibited
  assignment_seed: 20260827
  adjudication_rule: Exact agreement is required across four binary judgments, action, decisive evidence, invalid dependencies, replacement, and transfer guard. Only disagreements are sent to the frozen third reviewer.
  adjudicator_blinding: Primary identities and judgments are withheld; the third reviewer independently sees the same claim and evidence packet.

review_schema:
  binary_judgments:
    - factual_supported
    - interpretation_calibrated
    - alternative_adequate
    - evidence_sufficient
  actions: [accept, rewrite, reject_claim, abstain]
  grounded_decisions: Decisive and invalid dependency IDs must be unique and drawn only from the visible packet.
  accept_guard: All four judgments must pass and no invalid dependency may be recorded.
  corrective_guard: Rewrite or rejection requires an explicit recorded defect; rewrite requires replacement text.
  timing: Visibility-heartbeat server accounting; submissions are immutable after acceptance.

feedback_use:
  dependency_graph: source or graph evidence -> claim -> paragraph
  propagation: Invalid upstream evidence marks every dependent claim and paragraph for review.
  revision_scope: Only affected hash-bound paragraphs may be replaced; all other article bytes remain unchanged.
  citation_guard: A replacement may not introduce PH or REF identifiers outside its frozen affected-paragraph evidence set.
  abstention_rule: Any resolved abstention blocks automatic revision until a qualified human resolves it.
  learning_rule: Feedback may train component-specific guarded rules only through the separately frozen held-out transfer and regression gates; raw reviewer history is not appended as prompt memory.

prospective_outcomes:
  process:
    - primary disagreement rate
    - adjudication rate
    - active review seconds per claim and per corrected paragraph
    - affected paragraphs per invalid upstream dependency
    - fraction of article bytes preserved exactly
  efficacy:
    - independent blind expert strict support-and-calibration change from pre-review to post-review claims
    - correction precision among modified claims
    - harm rate among independently sampled unchanged claims
    - final CiteWeave versus one-shot and human article outcomes under the frozen expert evaluation protocol
  inference: Topic is the independent cluster; paired topic-level exact sign-flip tests and confidence intervals are primary where applicable.
  interpretation: Process invariants can establish correct execution. Human-review benefit requires real reviewer and independent expert outcomes.

