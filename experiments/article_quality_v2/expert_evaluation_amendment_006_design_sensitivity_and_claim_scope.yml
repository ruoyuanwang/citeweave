integrity_guard:
  - This amendment changes no article, prompt, evidence pack, rating scale, primary
    hypothesis, multiplicity family, noninferiority margin, or analysis code.
  - It freezes design sensitivity and the allowable language before any registered
    article response, same-evidence human article, or expert rating exists.
