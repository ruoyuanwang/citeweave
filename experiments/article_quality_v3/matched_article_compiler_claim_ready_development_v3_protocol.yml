motivation: >-
  Development v1 solved claim-review density but used 474063 prompt tokens across
  36 calls and had nine length-terminated sections. Development v2 increased response
  ceilings but its first request received HTTP 402 before any valid response. An offline
  section-view audit found that repeated retrieval metadata and irrelevant full abstracts
  account for avoidable prompt volume. V3 retains token-safe ceilings and replaces the
  full repeated writer payload with a hash-bound section-specific evidence view.

