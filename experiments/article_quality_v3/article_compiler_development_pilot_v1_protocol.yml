motivation: >-
  Both single-call development pilots achieved complete structural coverage but word
  counts remained unstable. Pilot v2 had all seven sections, all five PH phenomena in
  Results/Discussion/Conclusion, and all three syntheses in every draft, yet two of four
  drafts fell below the frozen 2700-word lower bound. Repeatedly tuning one global word
  instruction is therefore replaced by dependency-ordered section compilation.

scientific_role:
  development_only: true
  confirmatory_replacement: false
  pooling_with_prior_runs: prohibited
  intended_next_use: qualify a future separately frozen eight-topic comparison

panel:
  datasets:
    - explainable_ai_medical_imaging_2016_2025
    - sodium_ion_battery_cathodes_2010_2025
  condition: graph_dependency_article_compiler
  articles: 2
  section_calls_per_article: 7
  maximum_provider_calls: 14
  temperature: 0
  rendered_figure_access: false

compiler_design:
  generation_order:
    - Methods
    - Results
    - Discussion
    - Limitations
    - Conclusion
    - Introduction
    - Abstract
  dependency_edges:
    - Results -> Discussion
    - Methods + Results -> Limitations
    - Results + Discussion + Limitations -> Conclusion
    - Methods -> Introduction
    - all six sections -> Abstract
  deterministic_assembly_order:
    - Abstract
    - Introduction
    - Methods
    - Results
    - Discussion
    - Limitations
    - Conclusion
  total_target_from_section_ranges: 2880-3160_words
  adaptive_quality_resampling: prohibited
  section_response_limit: one

success_gate:
  - both articles finish all seven section calls without transport failure
  - every section response has finish_reason stop
  - assembled article passes unchanged 2700-3300 word gate
  - all five phenomena appear in Results and Discussion
  - at least three phenomena appear in Conclusion
  - at least two registered synthesis pairs span at least two paragraphs
  - no unregistered PH or REF token

