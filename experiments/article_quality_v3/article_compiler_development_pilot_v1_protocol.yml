integrity_guards:
  - Every dynamically materialized section request is hashed before its provider call.
  - A received section is immutable and is reused only after its stored hash is checked.
  - Later requests may depend only on frozen writer input, deterministic argument plan,
    and earlier immutable compiled sections.
  - No result may reclassify a prior formal or single-call development draft.
