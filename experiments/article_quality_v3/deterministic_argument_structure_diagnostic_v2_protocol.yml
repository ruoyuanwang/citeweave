schema_version: 1
protocol_id: deterministic_argument_structure_diagnostic_v2
status: frozen_before_v2_metric_execution
study_role: exploratory_diagnostic_not_confirmatory
objective: >-
  Diagnose whether the existing machine drafts differ from cached published human
  reports in argument shape, lexical reuse, evidence-marker integration, and
  critical-synthesis surface signals beyond simple length statistics.
comparison_scope:
  - Abstract
  - Results
  - Discussion
  - Conclusion
implementation:
  path: src/citeweave/article_argument_diagnostics.py
  sha256: e853d7a19302f9afdef95da4090178108aae6ef37435ba06b1fae1cf792b8a35
metric_contract:
  section_balance:
    - normalized_section_entropy
    - largest_section_share
    - section_word_counts
    - section_word_shares
  rhythmic_variation:
    - sentence_length_cv
  lexical_reuse:
    - mean_paragraph_pair_cosine
    - max_paragraph_pair_cosine
    - paragraph_pairs_cosine_ge_0_5_rate
    - repeated_six_content_word_opening_excess_rate
  evidence_marker_integration:
    - source_marker_mentions_per_1000_words
    - distinct_source_markers
    - source_bearing_sentence_fraction
    - multi_source_sentence_fraction
    - multi_source_share_among_source_bearing_sentences
  argument_surface_markers:
    - generic_scaffolding_markers_per_1000_words
    - contrast_markers_per_1000_words
    - alternative_explanation_markers_per_1000_words
    - failure_condition_markers_per_1000_words
    - mechanism_markers_per_1000_words
    - numeric_mentions_per_1000_words
interpretation_limits:
  - Machine and human texts cover different topics and different source evidence.
  - Cached human reports are selected article sections and are not a uniform genre.
  - REF identifiers and conventional human citation markers have different syntax and granularity.
  - Lexicon hits are surface proxies and are topic-sensitive; they do not prove mechanism quality or critical reasoning.
  - The four machine drafts are development outputs; no inferential test or superiority claim is permitted.
  - Results may motivate prompt and human-rating dimensions but may not modify confirmatory outcomes.
