integrity_guards:
  - Never overwrite or relabel a prior formal draft or assessment.
  - Never issue a second generation request for a response-received pilot cell.
  - A transport failure may retry only the identical frozen request.
  - Pilot outcomes are engineering evidence, not confirmatory article-quality evidence.
