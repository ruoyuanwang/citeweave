integrity_guards:
  - Protocol and plan are SHA256-frozen before any provider response.
  - Every dynamically reconstructed request must match its stored request hash.
  - Base and repair responses remain separate and immutable.
  - Both conditions receive exactly nine calls whether or not the base sections pass.
  - Provider secrets are never written to experiment artifacts.
  - No result may reclassify prior formal or development runs.
