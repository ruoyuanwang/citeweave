schema_version: 1
protocol_id: matched_article_compiler_claim_ready_development_v1
status: refrozen_after_presend_serialization_fix_before_provider_calls
frozen_at: '2026-09-08T04:21:18+08:00'

timing_disclosure:
  formal_single_call_responses: 16
  formal_gate_passes: 0
  earlier_development_single_call_responses: 8
  earlier_development_single_call_gate_passes: 4
  earlier_dependency_compiler_articles: 2
  earlier_budget_optimized_machine_gate_passes: 2
  earlier_budget_optimized_oversight_ready: 0
  all_prior_outcomes_inspected: true
  real_human_article_returns: 0
  provider_responses_before_refreeze: 0

motivation: >-
  Earlier compiler drafts passed structural and provenance gates after deterministic
  budgeting but contained only 15 independently reviewable PH-bearing claim sentences,
  below the frozen human-review packet requirement of 20. This pilot tests a generation
  contract aligned to the human-review interface and isolates graph dependency structure
  from a flat same-information control under matched provider-call budgets.

scientific_role:
  development_only: true
  confirmatory_replacement: false
  pooling_with_prior_runs: prohibited
  intended_next_use: qualify_or_reject_a_future_separately_frozen_eight_topic_comparison

panel:
  datasets:
    - explainable_ai_medical_imaging_2016_2025
    - sodium_ion_battery_cathodes_2010_2025
  conditions:
    - flat_article_compiler
    - graph_dependency_compiler
  articles: 4
  provider_calls_per_article: 9
  maximum_provider_calls: 36
  temperature: 0
  rendered_figure_access: false

matched_design:
  shared_information:
    - identical_writer_input
    - identical_five_phenomena_and_reference_ids
    - identical_three_registered_syntheses
    - identical_section_slots_and_section_dependencies
    - identical_generation_and_assembly_order
    - identical_prompt_word_budgets
    - identical_two_precommitted_repair_calls
    - identical_deterministic_budget_optimizer
  manipulated_factor:
    flat_article_compiler: >-
      A list of independent argument records with synthesis membership and section slots;
      no explicit dependency_edges field.
    graph_dependency_compiler: >-
      The same content represented as a graph argument plan with explicit dependency edges.
  generation_order:
    - Methods base
    - Results base
    - Results repair
    - Discussion base
    - Discussion repair
    - Limitations base
    - Conclusion base
    - Introduction base
    - Abstract base
  adaptive_resampling: prohibited
  section_response_limit: one_per_precommitted_call

claim_interface_contract:
  results: exactly_8_paragraphs_first_2_sentences_each_contain_PH_and_REF
  discussion: exactly_5_paragraphs_first_2_sentences_each_contain_PH_and_REF
  target_reviewable_candidates: at_least_20
  minimum_per_phenomenon: 2
  minimum_results_candidates: 8
  minimum_discussion_candidates: 6

final_processing:
  deterministic_assembly: true
  deterministic_sentence_budget_optimizer: true
  optimizer_only_removes_complete_sentences_without_PH_or_REF: true
  exact_evidence_token_set_preserved: true

article_success_gate:
  - exactly_nine_provider_responses
  - all_nine_finish_reason_stop
  - final_article_within_2700_3300_words
  - all_unchanged_structural_and_provenance_gates_pass
  - at_least_20_reviewable_claim_candidates
  - at_least_2_candidates_for_each_phenomenon
  - results_and_discussion_section_minima_pass

pilot_qualification_gate:
  - all_four_articles_pass_every_article_success_gate
  - only_then_may_an_eight_topic_confirmatory_protocol_be_frozen
  - no_effectiveness_claim_from_this_two_topic_development_pilot

