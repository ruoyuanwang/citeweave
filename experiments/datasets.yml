version: 1
language: en
snapshot_policy:
  retain_raw_responses: true
  record_sha256: true
  record_retrieval_time: true
  allow_truncated_samples: true
  interpretation: "A truncated snapshot is a reproducible benchmark sample, not a complete source census."

datasets:
  - id: rag_graph_2022_2025
    role: development
    source: import_file
    upstream_source: crossref
    input_file: "experiments/data/rag_graph_2022_2025.crossref.jsonl"
    input_format: jsonl
    title: "Graph retrieval-augmented generation research"
    keywords:
      - "graph retrieval augmented generation"
    query_mode: phrase
    year_from: 2022
    year_to: 2025
    document_types:
      - journal-article
    max_records: 300
    include_references: true
    relevance_terms:
      - graph
      - retrieval

  - id: crispr_editing_2018_2020
    role: development
    source: crossref
    title: "CRISPR gene editing research"
    keywords:
      - "CRISPR gene editing"
    query_mode: phrase
