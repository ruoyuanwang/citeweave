schema_version: 1
amendment_id: review_policy_amendment_005_integrated_capability_and_factorial_execution
status: frozen_before_real_reviewer_calibration_and_heldout_human_outcomes
frozen_at: '2026-09-07T23:00:00+08:00'
human_outcomes_inspected: false
heldout_outcomes_inspected: false
registered_real_reviewers: 0
calibration_returns: 0
confirmatory_returns: 0
previous_amendment_sha256: 79ade0f6b08372bdde34b477bfb644cb45590ed2572c4e3484f2da214b4c802c

reason:
  - The earlier protocol calibrated source relevance but did not establish reviewer
    competence for graph consistency, causal overreach, counterevidence coverage, or
    revision safety.
  - Per-case greedy routing and a contextual review log are insufficient evidence for
    an advanced human-machine oversight contribution.
  - The confirmatory panel therefore requires multidimensional calibration, an
    integrated predecision capability freeze, globally constrained assignment, blind
    adjudication, and a cryptographically bound result compiler.

scientific_integrity_disclosure:
  heldout_selection_timing: >-
    Task identities were frozen while the machine-only formal run was already in
    progress, before any real human review or human outcome existed.
  selector_result_access: false
  selector_inputs:
    - frozen construction manifests
    - benchmark task payloads and hashes
  heldout_selection_path: experiments/human_review_v2/oversight_heldout_selection_v1.json
  heldout_selection_sha256: b73f702551bb0011664fa3c2b64fc8cf6c981ba93f3224c4bcfbc3fda993fa46
  operational_unblinding_disclosure: >-
    An earlier operational monitor accidentally exposed aggregate in-progress machine
    metrics. The heldout selector never reads result files, scores, or aggregate
    effects. This amendment does not erase that disclosure and no confirmatory human
    outcome existed at freeze time.

calibration_and_capability_freeze:
  reviewers_required: 6
  source_relevance_observations_required: 120
  multidimensional_primary_observations_required: 144
  combined_observations_required: 264
  issue_types_required:
    - evidence_relevance
    - graph_answer_consistency
    - causal_overreach
    - counterevidence_coverage
    - revision_safety
  minimum_observations_per_reviewer_issue: 3
  minimum_domains_per_reviewer: 2
  posterior_fallback_order:
    - reviewer_domain_issue
    - reviewer_issue_across_domains
    - reviewer_domain_across_issues
    - reviewer_global
    - prior
  personalized_tiers_only:
    - exact
    - issue
    - domain
  prohibition:
    - Global-only and prior-only posteriors cannot qualify as personalized expertise.
    - Calibration packets and outcomes cannot enter the confirmatory panel.
    - Researcher-authored or simulated judgments cannot substitute for real reviewers.

prospective_heldout_panel:
  cases: 96
  datasets: 8
  cases_per_dataset: 12
  source_condition: graph_program
  terminal_gate: >-
    Candidate outputs are materialized only after primary, replication, and complexity
    extension terminal audits are complete with no parse, retry, or integrity failures.
  generation_condition_blinded: true
  gold_verdict_blinded: true
  public_condition_labels_prohibited: true
  same_evidence_across_packet_arms: true
  private_gold_rule: >-
    A deterministic verdict is derived from the frozen benchmark answer, evidence
    precision and recall, abstention, and required-limitation checks. It is never
    exposed in reviewer packets.

factorial_assignment:
  design: blocked_2x2
  packet_arms:
    - standard_claim_first
    - adversarial_two_sided
  assignment_arms:
    - qualified_random
    - capability_cost_router
  blocks:
    - dataset
    - domain
    - issue_type
    - severity
  minimum_cases_per_arm_per_dataset: 3
  optimizer: binary_milp
  crossover: every reviewer receives all four arms
  double_review_overlap_minimum: 0.5
  critical_cases_double_reviewed: true
  adjudicator: precommitted, distinct, and shown neither primary identity nor judgment
  qualified_random_control: frozen hash objective over the same capability-qualified team space
  capability_router_objective: >-
    Minimize expected severity-weighted residual error plus server-timed reviewer cost.
  no_silent_fallback: true

human_outcome_closure:
  primary_returns: exact assignment match with no duplicates or missing decisions
  timing: visibility-heartbeat server-accounted time only
  client_reported_timing_rejected: true
  answer_validation: adversarial schema plus packet evidence and operator-trace bounds
  adjudication_trigger: verdict disagreement between two primary reviewers only
  adjudication_blinding:
    primary_identities_hidden: true
    primary_judgments_hidden: true
  final_record_unit: one final verdict and total reviewer seconds per heldout case
  correctness: final verdict exactly matches the private deterministic gold verdict
  analysis: frozen equal-dataset O1/O2/O3 exact sign-flip analysis from amendment 003

readiness_gate_v2:
  - Exactly 96 unique cases across exactly 8 datasets and 12 cases per dataset.
  - Exactly 3 cases in each factorial arm within every dataset.
  - Packet, registry, capability, observations, assignment, and amendment hashes match.
  - Every route retains its predecision hash and uses only personalized qualified profiles.
  - Conflict constraints, reviewer/adjudicator role separation, critical double review,
    at least 50 percent overlap, and four-arm crossover all pass.
  - No real human return file may exist before readiness is recorded.

