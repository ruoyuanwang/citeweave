interpretation_guard:
  - Passing readiness proves execution integrity, not a positive scientific effect.
  - Human-oversight effects remain unavailable until six real reviewers complete the
    frozen calibration and confirmatory workflow.
  - Cases within one dataset are not independent scientific-topic replications.
