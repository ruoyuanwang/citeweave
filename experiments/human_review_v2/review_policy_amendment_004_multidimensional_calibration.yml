reason:
  - The source-relevance warmup calibrates evidence relevance only; it cannot identify
    which reviewer is better at graph arithmetic, causal-overreach detection,
    counterevidence use, or revision safety.
  - The prior capability model fell from reviewer-domain-issue directly to domain or
    reviewer-global evidence, erasing transferable issue-specific expertise when a
    held-out scientific domain was unseen during warmup.
  - Calling that fallback a capability-aware router would overstate personalization and
    could make the qualified-random and routed arms operationally indistinguishable.

calibration_panel:
  study_role: training_only_reviewer_capability_calibration
  confirmatory_exclusion: true
  source: The 40 pre-existing prototype graph-audit packets; no formal held-out candidate output.
  datasets: 8
  cases: 96
  cases_per_dataset: 12
  issue_types:
    - graph_answer_consistency
    - causal_overreach
    - counterevidence_coverage
    - revision_safety
  cases_per_issue_per_dataset: 3
  class_balance: 48 valid and 48 invalid controlled variants
  gold_construction: Deterministic injected-error transformations with private labels.
  primary_review: 96 first judgments plus independent overlap on 48 packets, for 144 total.
  adjudication: Every overlapping verdict disagreement goes to its preassigned blinded third reviewer.
  capability_scoring: Primary judgments are scored only against private injected gold; adjudicators are not self-scored and do not define correctness.
  blinding:
    - expected verdict
    - injected mutation
    - generation condition
    - support-versus-challenge evidence role
  prohibition:
    - Calibration cases cannot enter confirmatory outcomes.
    - A reviewer cannot see the same base graph case under multiple issue variants.
    - Researcher-authored reviewer responses cannot substitute for real responses.

capability_model_correction:
  family: hierarchical_beta
  prior_alpha: 2.0
  prior_beta: 2.0
  fallback_order:
    - reviewer_domain_issue
    - reviewer_issue_across_domains
    - reviewer_domain_across_issues
    - reviewer_global
    - prior
  minimum_exact_observations: 3
  minimum_issue_observations: 3
  minimum_domain_observations: 5
  heldout_rule: All observations and posteriors are frozen before held-out assignment.

promotion_gate:
  - Every issue type present in the prospective held-out panel must have reviewer-issue
    evidence for enough conflict-free reviewers to satisfy the requested route.
  - A global-only or prior-only posterior cannot qualify as personalized expertise.
  - Missing qualified coverage yields blocked_insufficient_reviewers; no silent fallback.

