interpretation_guard:
  - Controlled warmup accuracy estimates task-specific reviewer capability under the
    calibration interface; it is not a confirmatory estimate of article quality.
  - Capability-aware routing is an experimental treatment only after frozen assignments
    demonstrably differ from qualified random assignment on the same held-out sample.
