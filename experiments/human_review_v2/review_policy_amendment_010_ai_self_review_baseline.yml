rationale:
  - The generator does not emit a four-class audit verdict, so treating unaudited generation as an AI reviewer would make the complementarity baseline ill-posed.
  - A genuine AI-only reviewer must receive the same public evidence packet and return the same structured decision schema as a human reviewer.

frozen_design:
  panel_role: fixed_outcome_balanced_real_candidate_benchmark
  cases: 96
  packet_arms:
    - standard_claim_first
    - adversarial_two_sided
  planned_calls: 192
  model: deepseek-v4-pro
  temperature: 0
  maximum_prompt_tokens: 32768
  maximum_completion_tokens: 1200
  response_schema:
    - verdict
    - decisive_evidence_ids
    - invalid_operator_steps
    - failure_mode
    - minimal_rewrite
    - rationale
  matching_rule: Compare each human decision only with the AI decision generated from the exact packet arm seen by that human.
  hidden_information_rule: No gold verdict, selected generation condition, private audit path, or human outcome is supplied to the AI reviewer.
  retry_rule: Only transport failures may be retried, using the identical frozen request; parse failures are terminal observations.

