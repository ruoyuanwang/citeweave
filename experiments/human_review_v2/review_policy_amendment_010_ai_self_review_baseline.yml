interpretation_limits:
  - This baseline estimates same-packet human-versus-AI audit performance and packet-arm sensitivity.
  - Human-AI team benefit must be estimated prospectively from paired human, AI, and adjudication outcomes; it is not established by this freeze.
  - Because the case panel is outcome-balanced by design, prevalence-weighted deployment accuracy requires a separate natural-prevalence evaluation.
