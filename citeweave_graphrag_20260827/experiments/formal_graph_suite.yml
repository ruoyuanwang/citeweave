name: citeweave-formal-multitopic-graphrag
suite_root: runs/formal-multitopic-graphrag
source: europe_pmc
year_from: 2020
year_to: 2025
query_mode: all
include_references: false
minimum_topics: 10
repeats: 3
max_nodes: 50
label_budget: 40
random_seed: 20260827

# These structural gates are fixed before any formal model output is inspected.
eligibility:
  minimum_nodes: 40
  minimum_edges: 40
  minimum_communities: 2
  minimum_cross_edges: 1
  minimum_multi_hop_paths: 2
  max_corpus_jaccard: 0.20

graph_explanation:
  model: qwen3-vl-plus-2025-12-19
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  max_paths: 8
  max_hops: 4
  temperature: 0.0

# The LLM+bibliometrics pilot is deliberately excluded because it was used to tune
# the prompt and verifier. These are unseen, pre-registered candidate topics.
topics:
  - id: crispr-bibliometrics
    title: CRISPR bibliometric research
    keywords: [CRISPR, bibliometric]
  - id: telemedicine-bibliometrics
    title: Telemedicine bibliometric research
    keywords: [telemedicine, bibliometric]
  - id: microbiome-bibliometrics
    title: Microbiome bibliometric research
    keywords: [microbiome, bibliometric]
  - id: medical-imaging-bibliometrics
    title: Medical imaging bibliometric research
    keywords: ["medical imaging", bibliometric]
  - id: alzheimer-bibliometrics
    title: Alzheimer disease bibliometric research
    keywords: ["Alzheimer's disease", bibliometric]
  - id: stem-cell-bibliometrics
    title: Stem cell bibliometric research
    keywords: ["stem cell", bibliometric]
  - id: nanomedicine-bibliometrics
    title: Nanomedicine bibliometric research
    keywords: [nanomedicine, bibliometric]
  - id: antibiotic-resistance-bibliometrics
    title: Antibiotic resistance bibliometric research
    keywords: ["antibiotic resistance", bibliometric]
  - id: precision-medicine-bibliometrics
    title: Precision medicine bibliometric research
    keywords: ["precision medicine", bibliometric]
  - id: radiomics-bibliometrics
    title: Radiomics bibliometric research
    keywords: [radiomics, bibliometric]
  - id: gene-therapy-bibliometrics
    title: Gene therapy bibliometric research
    keywords: ["gene therapy", bibliometric]
  - id: vaccine-hesitancy-bibliometrics
    title: Vaccine hesitancy bibliometric research
    keywords: ["vaccine hesitancy", bibliometric]
